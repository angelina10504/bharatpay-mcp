x-nav-environment: &nav-environment
  NAV_MAX_SOURCE_BYTES: ${NAV_MAX_SOURCE_BYTES:-15000000}
  NAV_MIN_RECORDS: ${NAV_MIN_RECORDS:-1}
  NAV_MAX_REJECTED_FRACTION: ${NAV_MAX_REJECTED_FRACTION:-1}
  NAV_MAX_SOURCE_AGE_DAYS: ${NAV_MAX_SOURCE_AGE_DAYS:-}
  NAV_MAX_FUTURE_DAYS: ${NAV_MAX_FUTURE_DAYS:-}
services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      <<: *nav-environment
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "bharatpay_mcp.worker"]
    environment:
      <<: *nav-environment
      MONGO_URL: mongodb://mongo:27017
      WORKER_HEALTH_FILE: /tmp/worker.alive
    depends_on:
      mongo:
        condition: service_healthy
    init: true
    restart: unless-stopped
    # Healthy only while the claim loop advances, not merely while the process exists.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker.alive') > 300)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
  airflow:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: standalone
    environment:
      <<: *nav-environment
      MONGO_URL: mongodb://mongo:27017
      PYTHONPATH: /opt/project/src
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/pipelines
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow-data:/opt/airflow
    depends_on:
      mongo:
        condition: service_healthy
    init: true
volumes:
  mongo-data:
  airflow-data:
